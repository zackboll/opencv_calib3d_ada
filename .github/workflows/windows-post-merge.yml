name: Windows post-merge Calib3D
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/windows-post-merge.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true
      - name: Select Ada toolchain
        run: alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
      - name: Verify Alire-deployed MSYS2 packages
        run: |
          set -eu

          echo "=== Installed MSYS2 dependency versions ==="
          alr exec -- pacman -Q \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-cc-libs \
            mingw-w64-x86_64-libgcc \
            mingw-w64-x86_64-libstdc++ \
            mingw-w64-x86_64-libgfortran \
            mingw-w64-x86_64-libquadmath \
            mingw-w64-x86_64-libgomp \
            mingw-w64-x86_64-opencv \
            mingw-w64-x86_64-pkgconf

          echo "=== Installed dependency graph (not repository availability) ==="
          alr exec -- pacman -Qi \
            mingw-w64-x86_64-gcc \
            mingw-w64-x86_64-cc-libs \
            mingw-w64-x86_64-openblas \
            mingw-w64-x86_64-opencv

          # GCC 16.2 split the DLLs out of the empty gcc-libs/cc-libs packages.
          # Query file lists AND installed ownership; never install a metapackage
          # just to satisfy its historical name. Keep MSYS paths literal when
          # Git Bash launches native Alire/pacman from the Alire MSYS2 root.
          verify_runtime() {
            package="mingw-w64-x86_64-$1"
            dll="/mingw64/bin/$2"
            files=$(alr exec -- pacman -Ql "$package")
            printf '%s\n' "$files"
            printf '%s\n' "$files" | grep -Fx "$package $dll"
            owner=$(MSYS2_ARG_CONV_EXCL='*' alr exec -- pacman -Qqo "$dll")
            test "$owner" = "$package"
            alr exec -- pacman -Qk "$package"
          }
          verify_runtime libgcc libgcc_s_seh-1.dll
          verify_runtime libstdc++ libstdc++-6.dll
          verify_runtime libgfortran libgfortran-5.dll
          verify_runtime libquadmath libquadmath-0.dll
          verify_runtime libgomp libgomp-1.dll
          # libatomic is optional for GCC, not a dependency of this deployment.
          # If present, verify it too; missing required dependencies still fail Dk.
          installed=$(alr exec -- pacman -Qq)
          if printf '%s\n' "$installed" | grep -Fxq mingw-w64-x86_64-libatomic; then
            verify_runtime libatomic libatomic-1.dll
          fi

          echo "=== MSYS2 package database consistency ==="
          alr exec -- pacman -Dk
      - name: Build and run with isolated runtime
        run: sh scripts/test.sh
      - name: Inspect external Calib3D DLL
        run: |
          set -eu
          test -f lib/libopencv_calib3d_shim.dll
          test -f lib/libopencv_calib3d_shim.dll.a
          test ! -f lib/libopencv_calib3d_shim.a
          driver=$(sed -n 's/^[ ]*Cxx_Driver := "\(.*\)";/\1/p' config/opencv_calib3d_install.gpr)
          case "$driver" in
            *gnat_native*) exit 1 ;;
            *mingw64*/bin/g++*) ;;
            *) echo "error: expected MSYS2 MinGW64 g++, got $driver" >&2; exit 1 ;;
          esac
          for setting in OpenCV_Pose_Link_Option OpenCV_Core_Link_Option Core_Shim_Link_Option; do
            import_library=$(sed -n "s/^[ ]*$setting := \"\(.*\)\";/\1/p" config/opencv_calib3d_install.gpr)
            test -f "$import_library"
          done
          "$(dirname "$driver")/objdump.exe" -p lib/libopencv_calib3d_shim.dll > calib3d-pe.log
          grep -Ei 'DLL Name.*opencv_(calib3d|geometry)' calib3d-pe.log
          grep -i 'DLL Name.*opencv_core_shim' calib3d-pe.log
