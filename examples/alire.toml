name = "opencv_calib3d_examples"
description = "Examples for the OpenCV Calib3D Ada binding"
version = "0.1.0-dev"
authors = ["Zack Boll"]
maintainers = ["Zack Boll <zackboll@gmail.com>"]
maintainers-logins = ["zackboll"]
licenses = "Apache-2.0"
project-files = ["opencv_calib3d_examples.gpr"]
executables = ["pnp_synthetic", "homography_synthetic", "fundamental_synthetic", "essential_synthetic", "triangulation_synthetic", "relative_motion_synthetic", "metric_triangulation_synthetic", "metric_refinement_synthetic", "landmark_relocalization_synthetic", "known_pose_epipolar_synthetic", "three_view_landmarks_synthetic", "ray_plane_unprojection_synthetic", "plane_correspondence_synthetic", "reciprocal_plane_correspondence_synthetic", "known_plane_homography_synthetic"]

[[depends-on]]
opencv_calib3d = "*"

[[pins]]
opencv_calib3d = { path = ".." }
[[pins]]
opencv_core = { url = "https://github.com/zackboll/opencv_core_ada.git", commit = "4da9d35ea21e1b2efe96296243ea668b488c6326" }

[build-switches."*"]
ada_version = "Ada2022"
style_checks = "No"
